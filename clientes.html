<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topo h1 {
    margin: 0;
}

button {
    border: 0;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.formulario {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.clientes {
    background: white;
    padding: 25px;
    border-radius: 12px;
}

.cliente {
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.cliente strong {
    display: block;
    font-size: 18px;
}

.voltar {
    background: #555;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">
    <h1>👥 Clientes IMA</h1>
    <button class="voltar" onclick="voltarDashboard()">← Dashboard</button>
</div>

<div class="formulario">

<h2>Novo cliente</h2>

<input id="nome" type="text" placeholder="Nome do cliente">

<input id="email" type="email" placeholder="E-mail">

<input id="telefone" type="text" placeholder="Telefone">

<button onclick="adicionarCliente()">Adicionar cliente</button>

</div>

<div class="clientes">

<h2>Clientes cadastrados</h2>

<div id="listaClientes">
Carregando clientes...
</div>

</div>

</div>

<script>

const SUPABASE_URL = "https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY = "sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function carregarClientes() {

    const { data, error } = await supabaseClient
        .from("clientes")
        .select("*")
        .order("id", { ascending: false });

    const lista = document.getElementById("listaClientes");

    if (error) {
        console.error(error);
        lista.innerHTML = "Erro ao carregar clientes.";
        return;
    }

    if (!data || data.length === 0) {
        lista.innerHTML = "Nenhum cliente cadastrado ainda.";
        return;
    }

    lista.innerHTML = "";

    data.forEach(cliente => {

        const div = document.createElement("div");

        div.className = "cliente";

        div.innerHTML = `
            <strong>${cliente.nome}</strong>
            <span>${cliente.email || ""}</span><br>
            <span>${cliente.telefone || ""}</span>
        `;

        lista.appendChild(div);

    });
}


async function adicionarCliente() {

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const telefone = document.getElementById("telefone").value.trim();

    if (!nome) {
        alert("Digite o nome do cliente.");
        return;
    }

    const { error } = await supabaseClient
        .from("clientes")
        .insert([
            {
                nome: nome,
                email: email,
                telefone: telefone
            }
        ]);

    if (error) {
        console.error(error);
        alert("Erro ao cadastrar cliente.");
        return;
    }

    alert("Cliente cadastrado com sucesso!");

    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("telefone").value = "";

    carregarClientes();
}


function voltarDashboard() {
    window.location.href = "admin.html";
}


carregarClientes();

</script>

</body>
</html>
