<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

button {
    border: 0;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.formulario,
.clientes {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.cliente {
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.cliente strong {
    display: block;
    font-size: 18px;
}

.voltar {
    background: #555;
}

#mensagem {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">
    <h1>👥 Clientes IMA</h1>
    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>
</div>

<div class="formulario">

<h2>Novo cliente</h2>

<input id="nome" type="text" placeholder="Nome do cliente">

<input id="email" type="email" placeholder="E-mail">

<input id="telefone" type="text" placeholder="Telefone">

<input id="empresa" type="text" placeholder="Empresa">

<button onclick="adicionarCliente()">
Adicionar cliente
</button>

<div id="mensagem"></div>

</div>

<div class="clientes">

<h2>Clientes cadastrados</h2>

<div id="listaClientes">
Carregando clientes...
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function carregarClientes() {

    const lista =
    document.getElementById("listaClientes");

    lista.innerHTML = "Carregando clientes...";

    const { data, error } =
    await supabaseClient
    .from("clientes")
    .select("id,nome,email,telefone,empresa")
    .order("id", { ascending: false });

    console.log("Clientes:", data);
    console.log("Erro:", error);

    if (error) {

        lista.innerHTML =
        "Erro ao carregar clientes: " +
        error.message;

        return;
    }

    if (!data || data.length === 0) {

        lista.innerHTML =
        "Nenhum cliente cadastrado ainda.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(cliente => {

        const div =
        document.createElement("div");

        div.className = "cliente";

        div.innerHTML = `
            <strong>${cliente.nome || ""}</strong>
            <span>${cliente.email || ""}</span><br>
            <span>${cliente.telefone || ""}</span><br>
            <span>${cliente.empresa || ""}</span>
        `;

        lista.appendChild(div);

    });
}


async function adicionarCliente() {

    const nome =
    document.getElementById("nome").value.trim();

    const email =
    document.getElementById("email").value.trim();

    const telefone =
    document.getElementById("telefone").value.trim();

    const empresa =
    document.getElementById("empresa").value.trim();

    const mensagem =
    document.getElementById("mensagem");

    if (!nome) {

        mensagem.innerHTML =
        "Digite o nome do cliente.";

        return;
    }

    mensagem.innerHTML =
    "Cadastrando...";

    const { data, error } =
    await supabaseClient
    .from("clientes")
    .insert([
        {
            nome: nome,
            email: email || null,
            telefone: telefone || null,
            empresa: empresa || null
        }
    ])
    .select();

    console.log("Cliente:", data);
    console.log("Erro:", error);

    if (error) {

        mensagem.innerHTML =
        "ERRO: " + error.message;

        console.error(error);

        return;
    }

    mensagem.innerHTML =
    "✅ Cliente cadastrado com sucesso!";

    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("empresa").value = "";

    carregarClientes();
}


function voltarDashboard() {

    window.location.href = "admin.html";

}


carregarClientes();

</script>

</body>
</html>
