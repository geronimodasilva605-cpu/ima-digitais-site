<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topo h1 {
    margin: 0;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.formulario,
.clientes {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.cliente {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.cliente strong {
    display: block;
    font-size: 18px;
    margin-bottom: 5px;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.voltar {
    background: #555;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>👥 Clientes IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>


<div class="formulario">

<h2 id="tituloFormulario">Novo cliente</h2>

<input id="nome" type="text" placeholder="Nome do cliente">

<input id="email" type="email" placeholder="E-mail">

<input id="telefone" type="text" placeholder="Telefone">

<input id="empresa" type="text" placeholder="Empresa">


<button id="botaoSalvar" onclick="adicionarCliente()">
    Adicionar cliente
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;">
    Cancelar
</button>

</div>


<div class="clientes">

<h2>Clientes cadastrados</h2>

<div id="listaClientes">
    Carregando clientes...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let clienteEditando = null;


// ===============================
// CARREGAR CLIENTES
// ===============================

async function carregarClientes() {

    const { data, error } =
        await supabaseClient
            .from("clientes")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById(
            "listaClientes"
        );


    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar clientes: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum cliente cadastrado ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(cliente => {

        const div =
            document.createElement("div");

        div.className = "cliente";


        div.innerHTML = `

            <strong>
                ${cliente.nome || ""}
            </strong>

            <span>
                E-mail: ${cliente.email || ""}
            </span>

            <br>

            <span>
                Telefone: ${cliente.telefone || ""}
            </span>

            <br>

            <span>
                Empresa: ${cliente.empresa || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarCliente(${cliente.id})">
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirCliente(${cliente.id})">
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


// ===============================
// ADICIONAR CLIENTE
// ===============================

async function adicionarCliente() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const telefone =
        document.getElementById("telefone")
        .value.trim();

    const empresa =
        document.getElementById("empresa")
        .value.trim();


    if (!nome) {

        alert(
            "Digite o nome do cliente."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("clientes")
            .insert([{

                nome: nome,
                email: email,
                telefone: telefone,
                empresa: empresa

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar cliente: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Cliente cadastrado com sucesso!"
    );


    limparFormulario();

    carregarClientes();

}


// ===============================
// EDITAR CLIENTE
// ===============================

async function editarCliente(id) {

    const { data, error } =
        await supabaseClient
            .from("clientes")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar cliente: " +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("telefone").value =
        data.telefone || "";

    document.getElementById("empresa").value =
        data.empresa || "";


    clienteEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Editar cliente";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick = salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "inline-block";

}


// ===============================
// SALVAR EDIÇÃO
// ===============================

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const telefone =
        document.getElementById("telefone")
        .value.trim();

    const empresa =
        document.getElementById("empresa")
        .value.trim();


    if (!nome) {

        alert(
            "Digite o nome do cliente."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("clientes")
            .update({

                nome: nome,
                email: email,
                telefone: telefone,
                empresa: empresa

            })
            .eq("id", clienteEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar cliente: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Cliente atualizado com sucesso!"
    );


    cancelarEdicao();

    carregarClientes();

}


// ===============================
// EXCLUIR CLIENTE
// ===============================

async function excluirCliente(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este cliente?"
        );


    if (!confirmar) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("clientes")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir cliente: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Cliente excluído com sucesso!"
    );


    carregarClientes();

}


// ===============================
// CANCELAR EDIÇÃO
// ===============================

function cancelarEdicao() {

    clienteEditando = null;

    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Novo cliente";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Adicionar cliente";


    document.getElementById(
        "botaoSalvar"
    ).onclick = adicionarCliente;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "none";

}


// ===============================
// LIMPAR FORMULÁRIO
// ===============================

function limparFormulario() {

    document.getElementById("nome").value = "";

    document.getElementById("email").value = "";

    document.getElementById("telefone").value = "";

    document.getElementById("empresa").value = "";

}


// ===============================
// VOLTAR
// ===============================

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


carregarClientes();

</script>

</body>
</html>
