<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conteúdo - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
}

.topo h1 {
    margin: 0;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: 0.9;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.conteudos {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.formulario h2,
.conteudos h2 {
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

/* CHECKBOXES */

.plataformas {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 20px;
}

.plataformas label {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #f5f5f5;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.plataformas input[type="checkbox"] {
    width: auto;
    margin: 0;
}

/* ITENS */

.item {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.item:last-child {
    border-bottom: none;
}

.item strong {
    display: block;
    font-size: 19px;
    margin-bottom: 7px;
}

.item span {
    display: block;
    margin: 6px 0;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.mensagem {
    padding: 12px;
    background: #f4f4f4;
    border-radius: 8px;
}

/* RESPONSIVO */

@media (max-width: 600px) {

    .container {
        margin: 10px auto;
        padding: 12px;
    }

    .topo {
        flex-direction: column;
        align-items: stretch;
    }

    .topo h1 {
        font-size: 24px;
    }

    .voltar {
        width: 100%;
    }

    .formulario,
    .conteudos {
        padding: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

```
<!-- TOPO -->

<div class="topo">

    <h1>📢 Conteúdo IMA</h1>

    <button
        class="voltar"
        onclick="voltarDashboard()"
    >
        ← Dashboard
    </button>

</div>


<!-- FORMULÁRIO -->

<div class="formulario">

    <h2 id="tituloFormulario">
        Novo conteúdo
    </h2>


    <input
        id="titulo"
        type="text"
        placeholder="Título da publicação ou campanha"
    >


    <select id="tipo">

        <option value="Publicação">
            Publicação
        </option>

        <option value="Campanha">
            Campanha
        </option>

        <option value="Conteúdo">
            Conteúdo
        </option>

    </select>


    <input
        id="plataforma"
        type="text"
        placeholder="Descrição da plataforma ou campanha"
    >


    <h3>Publicar em:</h3>

    <div class="plataformas">

        <label>
            <input
                type="checkbox"
                id="facebook"
            >
            Facebook
        </label>


        <label>
            <input
                type="checkbox"
                id="linkedin"
            >
            LinkedIn
        </label>


        <label>
            <input
                type="checkbox"
                id="instagram"
            >
            Instagram
        </label>

    </div>


    <textarea
        id="descricao"
        placeholder="Descrição"
    ></textarea>


    <input
        id="valor"
        type="number"
        placeholder="Valor em Kz"
        min="0"
    >


    <select id="status">

        <option value="Pendente">
            Pendente
        </option>

        <option value="Em andamento">
            Em andamento
        </option>

        <option value="Publicado">
            Publicado
        </option>

        <option value="Concluído">
            Concluído
        </option>

    </select>


    <input
        id="data_publicacao"
        type="date"
    >


    <button
        id="botaoSalvar"
        onclick="adicionarConteudo()"
    >
        Adicionar conteúdo
    </button>


    <button
        id="botaoCancelar"
        class="cancelar"
        onclick="cancelarEdicao()"
        style="display:none;"
    >
        Cancelar
    </button>

</div>


<!-- LISTA -->

<div class="conteudos">

    <h2>
        Publicações, campanhas e conteúdos
    </h2>


    <div id="listaConteudo">

        <div class="mensagem">
            Carregando conteúdos...
        </div>

    </div>

</div>
```

</div>

<script>

/* =====================================================
   CONFIGURAÇÃO SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ID DO CONTEÚDO QUE ESTÁ SENDO EDITADO */

let conteudoEditando = null;


/* =====================================================
   CARREGAR CONTEÚDOS
===================================================== */

async function carregarConteudo() {

    const lista =
        document.getElementById("listaConteudo");


    lista.innerHTML =
        '<div class="mensagem">Carregando conteúdos...</div>';


    const { data, error } =
        await supabaseClient
            .from("conteudo")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar conteúdo: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            '<div class="mensagem">Nenhum conteúdo cadastrado ainda.</div>';

        return;
    }


    lista.innerHTML = "";


    data.forEach(item => {

        const div =
            document.createElement("div");


        div.className = "item";


        /* PLATAFORMAS */

        let plataformas = "";


        if (item.facebook) {

            plataformas +=
                "✅ Facebook ";

        }


        if (item.linkedin) {

            plataformas +=
                "✅ LinkedIn ";

        }


        if (item.instagram) {

            plataformas +=
                "✅ Instagram ";

        }


        if (!plataformas) {

            plataformas =
                "Nenhuma plataforma selecionada";

        }


        div.innerHTML = `

            <strong>
                ${escaparHTML(item.titulo || "")}
            </strong>


            <span>
                <b>Tipo:</b>
                ${escaparHTML(item.tipo || "")}
            </span>


            <span>
                <b>Plataforma:</b>
                ${escaparHTML(item.plataforma || "")}
            </span>


            <span>
                <b>Publicar em:</b>
                ${plataformas}
            </span>


            <span>
                <b>Descrição:</b>
                ${escaparHTML(item.descricao || "")}
            </span>


            <span>
                <b>Valor:</b>
                ${Number(item.valor || 0).toLocaleString("pt-AO")}
                Kz
            </span>


            <span>
                <b>Status:</b>
                ${escaparHTML(item.status || "")}
            </span>


            <span>
                <b>Data:</b>
                ${item.data_publicacao || "Não definida"}
            </span>


            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarConteudo(${item.id})"
                >
                    ✏️ Editar
                </button>


                <button
                    class="excluir"
                    onclick="excluirConteudo(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


/* =====================================================
   ADICIONAR CONTEÚDO
===================================================== */

async function adicionarConteudo() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const tipo =
        document
            .getElementById("tipo")
            .value;


    const plataforma =
        document
            .getElementById("plataforma")
            .value
            .trim();


    const descricao =
        document
            .getElementById("descricao")
            .value
            .trim();


    const valor =
        document
            .getElementById("valor")
            .value;


    const status =
        document
            .getElementById("status")
            .value;


    const data_publicacao =
        document
            .getElementById("data_publicacao")
            .value;


    const facebook =
        document
            .getElementById("facebook")
            .checked;


    const linkedin =
        document
            .getElementById("linkedin")
            .checked;


    const instagram =
        document
            .getElementById("instagram")
            .checked;


    /* VALIDAR TÍTULO */

    if (!titulo) {

        alert(
            "Digite o título."
        );

        return;
    }


    /* INSERIR NO SUPABASE */

    const { error } =
        await supabaseClient
            .from("conteudo")
            .insert([{

                titulo: titulo,

                tipo: tipo,

                plataforma: plataforma,

                descricao: descricao,

                valor:
                    Number(valor) || 0,

                status: status,

                data_publicacao:
                    data_publicacao || null,

                facebook:
                    facebook,

                linkedin:
                    linkedin,

                instagram:
                    instagram

            }]);


    /* VERIFICAR ERRO */

    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao cadastrar conteúdo:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo cadastrado com sucesso!"
    );


    limparFormulario();


    carregarConteudo();

}


/* =====================================================
   EDITAR CONTEÚDO
===================================================== */

async function editarConteudo(id) {

    const { data, error } =
        await supabaseClient
            .from("conteudo")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao buscar conteúdo:\n\n" +
            error.message
        );

        return;
    }


    /* PREENCHER FORMULÁRIO */

    document
        .getElementById("titulo")
        .value =
            data.titulo || "";


    document
        .getElementById("tipo")
        .value =
            data.tipo || "Publicação";


    document
        .getElementById("plataforma")
        .value =
            data.plataforma || "";


    document
        .getElementById("descricao")
        .value =
            data.descricao || "";


    document
        .getElementById("valor")
        .value =
            data.valor || 0;


    document
        .getElementById("status")
        .value =
            data.status || "Pendente";


    document
        .getElementById("data_publicacao")
        .value =
            data.data_publicacao || "";


    /* CHECKBOXES */

    document
        .getElementById("facebook")
        .checked =
            data.facebook === true;


    document
        .getElementById("linkedin")
        .checked =
            data.linkedin === true;


    document
        .getElementById("instagram")
        .checked =
            data.instagram === true;


    /* GUARDAR ID */

    conteudoEditando = id;


    /* ALTERAR TÍTULO */

    document
        .getElementById("tituloFormulario")
        .textContent =
            "Editar conteúdo";


    /* ALTERAR BOTÃO */

    const botaoSalvar =
        document.getElementById("botaoSalvar");


    botaoSalvar.textContent =
        "Salvar alterações";


    botaoSalvar.onclick =
        salvarEdicao;


    /* MOSTRAR CANCELAR */

    document
        .getElementById("botaoCancelar")
        .style.display =
            "inline-block";


    /* IR PARA O FORMULÁRIO */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   SALVAR EDIÇÃO
===================================================== */

async function salvarEdicao() {

    const titulo =
        document
            .getElementById("titulo")
            .value
            .trim();


    const tipo =
        document
            .getElementById("tipo")
            .value;


    const plataforma =
        document
            .getElementById("plataforma")
            .value
            .trim();


    const descricao =
        document
            .getElementById("descricao")
            .value
            .trim();


    const valor =
        document
            .getElementById("valor")
            .value;


    const status =
        document
            .getElementById("status")
            .value;


    const data_publicacao =
        document
            .getElementById("data_publicacao")
            .value;


    const facebook =
        document
            .getElementById("facebook")
            .checked;


    const linkedin =
        document
            .getElementById("linkedin")
            .checked;


    const instagram =
        document
            .getElementById("instagram")
            .checked;


    /* VALIDAR */

    if (!titulo) {

        alert(
            "Digite o título."
        );

        return;
    }


    if (!conteudoEditando) {

        alert(
            "Nenhum conteúdo selecionado para edição."
        );

        return;
    }


    /* ATUALIZAR */

    const { error } =
        await supabaseClient
            .from("conteudo")
            .update({

                titulo: titulo,

                tipo: tipo,

                plataforma: plataforma,

                descricao: descricao,

                valor:
                    Number(valor) || 0,

                status: status,

                data_publicacao:
                    data_publicacao || null,

                facebook:
                    facebook,

                linkedin:
                    linkedin,

                instagram:
                    instagram

            })
            .eq(
                "id",
                conteudoEditando
            );


    /* ERRO */

    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao atualizar:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo atualizado com sucesso!"
    );


    cancelarEdicao();


    carregarConteudo();

}


/* =====================================================
   EXCLUIR
===================================================== */

async function excluirConteudo(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este conteúdo?"
        );


    if (!confirmar) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("conteudo")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao excluir:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo excluído com sucesso!"
    );


    carregarConteudo();

}


/* =====================================================
   CANCELAR EDIÇÃO
===================================================== */

function cancelarEdicao() {

    conteudoEditando = null;


    limparFormulario();


    document
        .getElementById("tituloFormulario")
        .textContent =
            "Novo conteúdo";


    const botaoSalvar =
        document.getElementById("botaoSalvar");


    botaoSalvar.textContent =
        "Adicionar conteúdo";


    botaoSalvar.onclick =
        adicionarConteudo;


    document
        .getElementById("botaoCancelar")
        .style.display =
            "none";

}


/* =====================================================
   LIMPAR FORMULÁRIO
===================================================== */

function limparFormulario() {

    document
        .getElementById("titulo")
        .value = "";


    document
        .getElementById("tipo")
        .value =
            "Publicação";


    document
        .getElementById("plataforma")
        .value = "";


    document
        .getElementById("descricao")
        .value = "";


    document
        .getElementById("valor")
        .value = "";


    document
        .getElementById("status")
        .value =
            "Pendente";


    document
        .getElementById("data_publicacao")
        .value = "";


    document
        .getElementById("facebook")
        .checked = false;


    document
        .getElementById("linkedin")
        .checked = false;


    document
        .getElementById("instagram")
        .checked = false;

}


/* =====================================================
   VOLTAR PARA DASHBOARD
===================================================== */

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


/* =====================================================
   SEGURANÇA
   Evita inserir HTML diretamente vindo do banco
===================================================== */

function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto;

    return div.innerHTML;

}


/* =====================================================
   INICIAR
===================================================== */

carregarConteudo();

</script>

</body>
</html>
