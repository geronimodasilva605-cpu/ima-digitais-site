<!DOCTYPE html>
<html lang="pt">

<style>

<body>

    <h1>📢 Conteúdo IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>

<div class="formulario">

<h2 id="tituloFormulario">Novo conteúdo</h2>

<input
    id="titulo"

    </option>

</select>

<input
    id="plataforma"

    placeholder="Plataforma (Facebook, Instagram, LinkedIn...)"
>


<h3>Publicar em:</h3>

<input type="checkbox" id="instagram">
Instagram

</select>

<input

>

<button id="botaoSalvar" onclick="adicionarConteudo()">

    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;"
>

</button>

</div>

<div class="conteudos">

<h2>Publicações, campanhas e conteúdos</h2>

<div id="listaConteudo">
    Carregando conteúdos...
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let conteudoEditando = null;


// CARREGAR

async function carregarConteudo() {

    const { data, error } =
        await supabaseClient
            .from("conteudo")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById("listaConteudo");

    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar conteúdo: " +
            error.message;

        return;
    }

    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum conteúdo cadastrado ainda.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <strong>
                ${item.titulo || ""}
            </strong>

            <span>
                Tipo: ${item.tipo || ""}
            </span>

            <span>
                Plataforma: ${item.plataforma || ""}
            </span>

            <span>
                Descrição: ${item.descricao || ""}
            </span>

            <span>
                Valor: ${Number(item.valor || 0).toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Status: ${item.status || ""}
            </span>

            <span>
                Data: ${item.data_publicacao || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarConteudo(${item.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirConteudo(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;

        lista.appendChild(div);

    });
}


// ADICIONAR

async function adicionarConteudo() {

    const titulo =
        document.getElementById("titulo")
        .value.trim();

    const tipo =
        document.getElementById("tipo")
        .value;

    const plataforma =
        document.getElementById("plataforma")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;

    const data_publicacao =
        document.getElementById("data_publicacao")
        .value;
const facebook =
    document.getElementById("facebook").checked;

const linkedin =
    document.getElementById("linkedin").checked;

    if (!titulo) {

        alert(
            "Digite o título."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("conteudo")
            .insert([{

                titulo: titulo,
                tipo: tipo,
                plataforma: plataforma,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status,
               data_publicacao:
    data_publicacao || null,

facebook: facebook,

linkedin: linkedin
            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar conteúdo: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo cadastrado com sucesso!"
    );

    limparFormulario();

    carregarConteudo();
}


// EDITAR

async function editarConteudo(id) {

    const { data, error } =
        await supabaseClient
            .from("conteudo")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar conteúdo: " +
            error.message
        );

        return;
    }


    document.getElementById("titulo").value =
        data.titulo || "";

    document.getElementById("tipo").value =
        data.tipo || "Conteúdo";

    document.getElementById("plataforma").value =
        data.plataforma || "";

    document.getElementById("descricao").value =
        data.descricao || "";

    document.getElementById("valor").value =
        data.valor || 0;

    document.getElementById("status").value =
        data.status || "Pendente";

    document.getElementById("data_publicacao").value =
        data.data_publicacao || "";


    conteudoEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Editar conteúdo";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "inline-block";
}


// SALVAR EDIÇÃO

async function salvarEdicao() {

    const titulo =
        document.getElementById("titulo")
        .value.trim();

    const tipo =
        document.getElementById("tipo")
        .value;

    const plataforma =
        document.getElementById("plataforma")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;

    const data_publicacao =
        document.getElementById("data_publicacao")
        .value;


    if (!titulo) {

        alert(
            "Digite o título."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("conteudo")
            .update({

                titulo: titulo,
                tipo: tipo,
                plataforma: plataforma,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status,
                data_publicacao:
                    data_publicacao || null

            })
            .eq("id", conteudoEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo atualizado com sucesso!"
    );

    cancelarEdicao();

    carregarConteudo();
}


// EXCLUIR

async function excluirConteudo(id) {

    if (!confirm(
        "Tem certeza que deseja excluir este conteúdo?"
    )) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("conteudo")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Conteúdo excluído com sucesso!"
    );

    carregarConteudo();
}


// CANCELAR

function cancelarEdicao() {

    conteudoEditando = null;

    limparFormulario();

    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Novo conteúdo";

    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Adicionar conteúdo";

    document.getElementById(
        "botaoSalvar"
    ).onclick =
        adicionarConteudo;

    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "none";
}


// LIMPAR

function limparFormulario() {

    document.getElementById("titulo").value = "";

    document.getElementById("tipo").value =
        "Publicação";

    document.getElementById("plataforma").value = "";

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    document.getElementById("status").value =
        "Pendente";

    document.getElementById("data_publicacao").value = "";

    document.getElementById("facebook").checked = false;

    document.getElementById("linkedin").checked = false;
}

// VOLTAR

function voltarDashboard() {

    window.location.href =
        "admin.html";
}


carregarConteudo();

</script>

</body>
</html>
