```html
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Design - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.designs {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.design {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.design strong {
    display: block;
    font-size: 19px;
    margin-bottom: 7px;
}

.design span {
    display: block;
    margin: 4px 0;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>🎨 Design IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>


<div class="formulario">

<h2 id="tituloFormulario">Novo trabalho de Design</h2>

<input
    id="nome"
    type="text"
    placeholder="Nome do trabalho"
>

<input
    id="cliente"
    type="text"
    placeholder="Nome do cliente"
>

<textarea
    id="descricao"
    placeholder="Descrição do trabalho"
></textarea>

<input
    id="valor"
    type="number"
    placeholder="Valor em Kz"
>

<select id="status">

    <option value="Pendente">
        Pendente
    </option>

    <option value="Em andamento">
        Em andamento
    </option>

    <option value="Concluído">
        Concluído
    </option>

</select>

<button id="botaoSalvar" onclick="adicionarDesign()">
    Adicionar trabalho
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;"
>
    Cancelar
</button>

</div>


<div class="designs">

<h2>Trabalhos de Design</h2>

<div id="listaDesign">
    Carregando trabalhos...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let designEditando = null;


// ============================
// CARREGAR DESIGN
// ============================

async function carregarDesign() {

    const { data, error } =
        await supabaseClient
            .from("design")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById(
            "listaDesign"
        );


    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar Design: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum trabalho de Design cadastrado ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "design";


        div.innerHTML = `

            <strong>
                ${item.nome || ""}
            </strong>

            <span>
                Cliente: ${item.cliente || ""}
            </span>

            <span>
                Descrição: ${item.descricao || ""}
            </span>

            <span>
                Valor: ${Number(item.valor || 0).toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Status: ${item.status || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarDesign(${item.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirDesign(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


// ============================
// ADICIONAR DESIGN
// ============================

async function adicionarDesign() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("design")
            .insert([{

                nome: nome,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar Design: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho de Design cadastrado com sucesso!"
    );


    limparFormulario();

    carregarDesign();

}


// ============================
// EDITAR DESIGN
// ============================

async function editarDesign(id) {

    const { data, error } =
        await supabaseClient
            .from("design")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar trabalho: " +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";

    document.getElementById("cliente").value =
        data.cliente || "";

    document.getElementById("descricao").value =
        data.descricao || "";

    document.getElementById("valor").value =
        data.valor || 0;

    document.getElementById("status").value =
        data.status || "Pendente";


    designEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Editar trabalho de Design";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick = salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "inline-block";

}


// ============================
// SALVAR EDIÇÃO
// ============================

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("design")
            .update({

                nome: nome,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            })
            .eq("id", designEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar Design: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho atualizado com sucesso!"
    );


    cancelarEdicao();

    carregarDesign();

}


// ============================
// EXCLUIR DESIGN
// ============================

async function excluirDesign(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este trabalho?"
        );


    if (!confirmar) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("design")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir Design: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho excluído com sucesso!"
    );


    carregarDesign();

}


// ============================
// CANCELAR EDIÇÃO
// ============================

function cancelarEdicao() {

    designEditando = null;

    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Novo trabalho de Design";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Adicionar trabalho";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        adicionarDesign;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "none";

}


// ============================
// LIMPAR FORMULÁRIO
// ============================

function limparFormulario() {

    document.getElementById("nome").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    document.getElementById("status").value =
        "Pendente";

}


// ============================
// VOLTAR DASHBOARD
// ============================

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


carregarDesign();

</script>

</body>
</html>
```
