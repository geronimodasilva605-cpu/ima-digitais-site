        width: 100%;

}

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let designEditando = null;

let usuarioAtual = null;

let perfilAtual = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const carregando =
document.getElementById("carregando");

const conteudoPagina =
document.getElementById("conteudoPagina");


/* =====================================================
   VERIFICAR ACESSO
===================================================== */

async function verificarAcesso() {

    try {

        const {
            data: sessaoData,
            error: sessaoError
        } =
            await supabaseClient.auth.getSession();


        if (sessaoError) {

            console.error(sessaoError);

            bloquearAcesso(
                "Erro ao verificar a sessão."
            );

            return;
        }


        if (!sessaoData.session) {

            window.location.href =
                "login.html";

            return;
        }


        usuarioAtual =
            sessaoData.session.user;


        /* =============================================
           BUSCAR PERFIL
        ============================================= */

        const {
            data: perfil,
            error: perfilError
        } =
            await supabaseClient
                .from("perfis")
                .select("id,nome,email,setor")
                .eq("id", usuarioAtual.id)
                .maybeSingle();


        if (perfilError) {

            console.error(
                "Erro ao buscar perfil:",
                perfilError
            );

            bloquearAcesso(
                "Não foi possível verificar o seu perfil."
            );

            return;
        }


        if (!perfil) {

            bloquearAcesso(
                "Seu perfil não está configurado."
            );

            return;
        }


        perfilAtual =
            perfil;


        const setor =
            (perfil.setor || "")
                .toLowerCase()
                .trim();


        /* =============================================
           PERMISSÃO
        ============================================= */

        const permitido =
            setor === "design" ||
            setor === "administrador";


        if (!permitido) {

            bloquearAcesso(
                "🚫 Acesso negado. Esta área é exclusiva do setor Design."
            );

            return;
        }


        /* =============================================
           MOSTRAR PÁGINA
        ============================================= */

        document
            .getElementById("setorUsuario")
            .textContent =
                perfil.setor;


        carregando.style.display =
            "none";


        conteudoPagina.style.display =
            "block";


        carregarDesign();

    } catch (erro) {

        console.error(erro);

        bloquearAcesso(
            "Erro inesperado ao verificar o acesso."
        );

    }

}


/* =====================================================
   BLOQUEAR
===================================================== */

function bloquearAcesso(
    mensagem
) {

    carregando.innerHTML = `
        <div style="
            text-align:center;
            padding:20px;
        ">
            <div style="
                font-size:50px;
                margin-bottom:15px;
            ">
                🔒
            </div>

            <div style="
                font-size:18px;
                margin-bottom:20px;
            ">
                ${mensagem}
            </div>

            <button
                onclick="window.location.href='admin.html'"
                style="
                    background:#2563eb;
                    padding:12px 18px;
                    border:0;
                    border-radius:8px;
                    color:white;
                    cursor:pointer;
                "
            >
                ← Voltar ao Dashboard
            </button>
        </div>
    `;

}


/* =====================================================
   CARREGAR DESIGN
===================================================== */

async function carregarDesign() {

    const lista =
        document.getElementById(
            "listaDesign"
        );


    lista.innerHTML =
        "Carregando trabalhos...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("design")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        console.error(error);

        lista.innerHTML =
            "❌ Erro ao carregar Design: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum trabalho de Design cadastrado ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(item => {

        const div =
            document.createElement("div");


        div.className =
            "design";


        div.innerHTML = `

            <strong>
                ${escaparHTML(item.nome || "")}
            </strong>

            <span>
                Cliente:
                ${escaparHTML(item.cliente || "")}
            </span>

            <span>
                Tipo:
                ${escaparHTML(item.tipo || "")}
            </span>

            <span>
                Descrição:
                ${escaparHTML(item.descricao || "")}
            </span>

            <span>
                Valor:
                ${Number(item.valor || 0)
                    .toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Status:
                ${escaparHTML(item.status || "")}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarDesign(${item.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirDesign(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


/* =====================================================
   ADICIONAR
===================================================== */

async function adicionarDesign() {

    const nome =
        document.getElementById("nome")
            .value.trim();


    const cliente =
        document.getElementById("cliente")
            .value.trim();


    const tipo =
        document.getElementById("tipo")
            .value;


    const descricao =
        document.getElementById("descricao")
            .value.trim();


    const valor =
        document.getElementById("valor")
            .value;


    const status =
        document.getElementById("status")
            .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    if (!usuarioAtual) {

        alert(
            "Sessão do usuário não encontrada."
        );

        return;
    }


    /* =============================================
       GRAVAR COM O ID DO USUÁRIO
    ============================================= */

    const {
        error
    } =
        await supabaseClient
            .from("design")
            .insert([{

                nome: nome,

                cliente: cliente,

                tipo: tipo,

                descricao: descricao,

                valor:
                    Number(valor) || 0,

                status: status,

                usuario_id:
                    usuarioAtual.id

            }]);


    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao cadastrar Design:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho de Design cadastrado com sucesso!"
    );


    limparFormulario();


    carregarDesign();

}


/* =====================================================
   EDITAR
===================================================== */

async function editarDesign(id) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("design")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        console.error(error);

        alert(
            "Erro ao buscar trabalho:\n\n" +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";


    document.getElementById("cliente").value =
        data.cliente || "";


    document.getElementById("tipo").value =
        data.tipo || "Outro";


    document.getElementById("descricao").value =
        data.descricao || "";


    document.getElementById("valor").value =
        data.valor || 0;


    document.getElementById("status").value =
        data.status || "Pendente";


    designEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Editar trabalho de Design";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   SALVAR EDIÇÃO
===================================================== */

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
            .value.trim();


    const cliente =
        document.getElementById("cliente")
            .value.trim();


    const tipo =
        document.getElementById("tipo")
            .value;


    const descricao =
        document.getElementById("descricao")
            .value.trim();


    const valor =
        document.getElementById("valor")
            .value;


    const status =
        document.getElementById("status")
            .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("design")
            .update({

                nome: nome,

                cliente: cliente,

                tipo: tipo,

                descricao: descricao,

                valor:
                    Number(valor) || 0,

                status: status

            })
            .eq(
                "id",
                designEditando
            );


    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao atualizar Design:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho atualizado com sucesso!"
    );


    cancelarEdicao();


    carregarDesign();

}


/* =====================================================
   EXCLUIR
===================================================== */

async function excluirDesign(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este trabalho?"
        );


    if (!confirmar) {

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("design")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "❌ Erro ao excluir Design:\n\n" +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho excluído com sucesso!"
    );


    carregarDesign();

}


/* =====================================================
   CANCELAR
===================================================== */

function cancelarEdicao() {

    designEditando = null;


    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Novo trabalho de Design";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Adicionar trabalho";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        adicionarDesign;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "none";

}


/* =====================================================
   LIMPAR
===================================================== */

function limparFormulario() {

    document.getElementById("nome")
        .value = "";


    document.getElementById("cliente")
        .value = "";


    document.getElementById("tipo")
        .value = "Logotipo";


    document.getElementById("descricao")
        .value = "";


    document.getElementById("valor")
        .value = "";


    document.getElementById("status")
        .value =
            "Pendente";

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto;

    return div.innerHTML;

}


/* =====================================================
   INICIAR
===================================================== */

verificarAcesso();

</script>

</body>
</html>
