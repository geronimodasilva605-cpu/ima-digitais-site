<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipa - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.equipa {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.membro {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.membro strong {
    display: block;
    font-size: 18px;
    margin-bottom: 5px;
}

.cargo {
    font-weight: bold;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>👨‍💻 Equipa IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>


<div class="formulario">

<h2 id="tituloFormulario">Novo membro</h2>

<input id="nome" type="text" placeholder="Nome completo">

<input id="cargo" type="text" placeholder="Cargo">

<input id="email" type="email" placeholder="E-mail">

<input id="telefone" type="text" placeholder="Telefone">

<input id="setor" type="text" placeholder="Setor">


<button id="botaoSalvar" onclick="adicionarMembro()">
    Adicionar membro
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;">
    Cancelar
</button>

</div>


<div class="equipa">

<h2>Membros da equipa</h2>

<div id="listaEquipa">
    Carregando equipa...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let membroEditando = null;


// ============================
// CARREGAR EQUIPA
// ============================

async function carregarEquipa() {

    const { data, error } =
        await supabaseClient
            .from("equipa")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById("listaEquipa");


    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar equipa: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum membro cadastrado ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(membro => {

        const div =
            document.createElement("div");

        div.className = "membro";


        div.innerHTML = `

            <strong>
                ${membro.nome || ""}
            </strong>

            <span class="cargo">
                ${membro.cargo || ""}
            </span>

            <br>

            <span>
                E-mail: ${membro.email || ""}
            </span>

            <br>

            <span>
                Telefone: ${membro.telefone || ""}
            </span>

            <br>

            <span>
                Setor: ${membro.setor || ""}
            </span>


            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarMembro(${membro.id})">
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirMembro(${membro.id})">
                    🗑️ Excluir
                </button>

            </div>
        `;


        lista.appendChild(div);

    });

}


// ============================
// ADICIONAR MEMBRO
// ============================

async function adicionarMembro() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cargo =
        document.getElementById("cargo")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const telefone =
        document.getElementById("telefone")
        .value.trim();

    const setor =
        document.getElementById("setor")
        .value.trim();


    if (!nome) {

        alert(
            "Digite o nome do membro."
        );

        return;
    }


    if (!cargo) {

        alert(
            "Digite o cargo."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("equipa")
            .insert([{

                nome: nome,
                cargo: cargo,
                email: email,
                telefone: telefone,
                setor: setor

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar membro: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Membro cadastrado com sucesso!"
    );


    limparFormulario();

    carregarEquipa();

}


// ============================
// EDITAR MEMBRO
// ============================

async function editarMembro(id) {

    const { data, error } =
        await supabaseClient
            .from("equipa")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar membro: " +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";

    document.getElementById("cargo").value =
        data.cargo || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("telefone").value =
        data.telefone || "";

    document.getElementById("setor").value =
        data.setor || "";


    membroEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Editar membro";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick = salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "inline-block";

}


// ============================
// SALVAR EDIÇÃO
// ============================

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cargo =
        document.getElementById("cargo")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim();

    const telefone =
        document.getElementById("telefone")
        .value.trim();

    const setor =
        document.getElementById("setor")
        .value.trim();


    if (!nome) {

        alert(
            "Digite o nome do membro."
        );

        return;
    }


    if (!cargo) {

        alert(
            "Digite o cargo."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("equipa")
            .update({

                nome: nome,
                cargo: cargo,
                email: email,
                telefone: telefone,
                setor: setor

            })
            .eq("id", membroEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar membro: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Membro atualizado com sucesso!"
    );


    cancelarEdicao();

    carregarEquipa();

}


// ============================
// EXCLUIR MEMBRO
// ============================

async function excluirMembro(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este membro?"
        );


    if (!confirmar) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("equipa")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir membro: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Membro excluído com sucesso!"
    );


    carregarEquipa();

}


// ============================
// CANCELAR EDIÇÃO
// ============================

function cancelarEdicao() {

    membroEditando = null;

    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Novo membro";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Adicionar membro";


    document.getElementById(
        "botaoSalvar"
    ).onclick = adicionarMembro;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "none";

}


// ============================
// LIMPAR FORMULÁRIO
// ============================

function limparFormulario() {

    document.getElementById("nome").value = "";

    document.getElementById("cargo").value = "";

    document.getElementById("email").value = "";

    document.getElementById("telefone").value = "";

    document.getElementById("setor").value = "";

}


// ============================
// VOLTAR DASHBOARD
// ============================

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


carregarEquipa();

</script>

</body>
</html>
