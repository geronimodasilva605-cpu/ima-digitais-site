```html
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.campanhas {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.campanha {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.campanha strong {
    display: block;
    font-size: 19px;
    margin-bottom: 7px;
}

.campanha span {
    display: block;
    margin: 4px 0;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>📱 Marketing IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>


<div class="formulario">

<h2 id="tituloFormulario">Nova campanha</h2>

<input
    id="campanha"
    type="text"
    placeholder="Nome da campanha"
>

<input
    id="cliente"
    type="text"
    placeholder="Nome do cliente"
>

<textarea
    id="descricao"
    placeholder="Descrição da campanha"
></textarea>

<input
    id="valor"
    type="number"
    placeholder="Orçamento em Kz"
>

<select id="status">

    <option value="Pendente">
        Pendente
    </option>

    <option value="Em andamento">
        Em andamento
    </option>

    <option value="Concluído">
        Concluído
    </option>

</select>

<button id="botaoSalvar" onclick="adicionarMarketing()">
    Adicionar campanha
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;"
>
    Cancelar
</button>

</div>


<div class="campanhas">

<h2>Campanhas cadastradas</h2>

<div id="listaMarketing">
    Carregando campanhas...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let marketingEditando = null;


// ============================
// CARREGAR CAMPANHAS
// ============================

async function carregarMarketing() {

    const { data, error } =
        await supabaseClient
            .from("marketing")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById("listaMarketing");


    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar campanhas: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhuma campanha cadastrada ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "campanha";


        div.innerHTML = `

            <strong>
                ${item.campanha || ""}
            </strong>

            <span>
                Cliente: ${item.cliente || ""}
            </span>

            <span>
                Descrição: ${item.descricao || ""}
            </span>

            <span>
                Orçamento: ${Number(item.valor || 0).toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Status: ${item.status || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarMarketing(${item.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirMarketing(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


// ============================
// ADICIONAR CAMPANHA
// ============================

async function adicionarMarketing() {

    const campanha =
        document.getElementById("campanha")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!campanha) {

        alert(
            "Digite o nome da campanha."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("marketing")
            .insert([{

                campanha: campanha,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar campanha: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Campanha cadastrada com sucesso!"
    );


    limparFormulario();

    carregarMarketing();

}


// ============================
// EDITAR
// ============================

async function editarMarketing(id) {

    const { data, error } =
        await supabaseClient
            .from("marketing")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar campanha: " +
            error.message
        );

        return;
    }


    document.getElementById("campanha").value =
        data.campanha || "";

    document.getElementById("cliente").value =
        data.cliente || "";

    document.getElementById("descricao").value =
        data.descricao || "";

    document.getElementById("valor").value =
        data.valor || 0;

    document.getElementById("status").value =
        data.status || "Pendente";


    marketingEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Editar campanha";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "inline-block";

}


// ============================
// SALVAR EDIÇÃO
// ============================

async function salvarEdicao() {

    const campanha =
        document.getElementById("campanha")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!campanha) {

        alert(
            "Digite o nome da campanha."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("marketing")
            .update({

                campanha: campanha,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            })
            .eq("id", marketingEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar campanha: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Campanha atualizada com sucesso!"
    );


    cancelarEdicao();

    carregarMarketing();

}


// ============================
// EXCLUIR
// ============================

async function excluirMarketing(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir esta campanha?"
        );


    if (!confirmar) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("marketing")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir campanha: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Campanha excluída com sucesso!"
    );


    carregarMarketing();

}


// ============================
// CANCELAR
// ============================

function cancelarEdicao() {

    marketingEditando = null;

    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Nova campanha";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Adicionar campanha";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        adicionarMarketing;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "none";

}


// ============================
// LIMPAR
// ============================

function limparFormulario() {

    document.getElementById("campanha").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    document.getElementById("status").value =
        "Pendente";

}


// ============================
// VOLTAR
// ============================

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


carregarMarketing();

</script>

</body>
</html>
```
