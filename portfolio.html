```html
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfólio - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topo h1 {
    margin: 0;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.portfolios {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.item {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.item strong {
    display: block;
    font-size: 19px;
    margin-bottom: 7px;
}

.item span {
    display: block;
    margin: 4px 0;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>🖼️ Portfólio IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>

<div class="formulario">

<h2 id="tituloFormulario">Novo trabalho</h2>

<input
    id="nome"
    type="text"
    placeholder="Nome do trabalho"
>

<input
    id="cliente"
    type="text"
    placeholder="Nome do cliente"
>

<select id="categoria">

    <option value="Design">
        Design
    </option>

    <option value="Web">
        Web
    </option>

    <option value="Marketing">
        Marketing
    </option>

    <option value="Identidade Visual">
        Identidade Visual
    </option>

    <option value="Outro">
        Outro
    </option>

</select>

<textarea
    id="descricao"
    placeholder="Descrição do trabalho"
></textarea>

<input
    id="valor"
    type="number"
    placeholder="Valor em Kz"
>

<input
    id="data_trabalho"
    type="date"
>

<button id="botaoSalvar" onclick="adicionarPortfolio()">
    Adicionar trabalho
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;"
>
    Cancelar
</button>

</div>

<div class="portfolios">

<h2>Trabalhos cadastrados</h2>

<div id="listaPortfolio">
    Carregando portfólio...
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let portfolioEditando = null;


// CARREGAR PORTFÓLIO

async function carregarPortfolio() {

    const { data, error } =
        await supabaseClient
            .from("portfolio")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById("listaPortfolio");

    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar portfólio: " +
            error.message;

        return;
    }

    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum trabalho cadastrado ainda.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <strong>
                ${item.nome || ""}
            </strong>

            <span>
                Cliente: ${item.cliente || ""}
            </span>

            <span>
                Categoria: ${item.categoria || ""}
            </span>

            <span>
                Descrição: ${item.descricao || ""}
            </span>

            <span>
                Valor: ${Number(item.valor || 0).toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Data: ${item.data_trabalho || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarPortfolio(${item.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirPortfolio(${item.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;

        lista.appendChild(div);

    });
}


// ADICIONAR

async function adicionarPortfolio() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const categoria =
        document.getElementById("categoria")
        .value;

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const data_trabalho =
        document.getElementById("data_trabalho")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("portfolio")
            .insert([{

                nome: nome,
                cliente: cliente,
                categoria: categoria,
                descricao: descricao,
                valor: Number(valor) || 0,
                data_trabalho:
                    data_trabalho || null

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar portfólio: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho adicionado ao portfólio!"
    );

    limparFormulario();

    carregarPortfolio();
}


// EDITAR

async function editarPortfolio(id) {

    const { data, error } =
        await supabaseClient
            .from("portfolio")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar trabalho: " +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";

    document.getElementById("cliente").value =
        data.cliente || "";

    document.getElementById("categoria").value =
        data.categoria || "Outro";

    document.getElementById("descricao").value =
        data.descricao || "";

    document.getElementById("valor").value =
        data.valor || 0;

    document.getElementById("data_trabalho").value =
        data.data_trabalho || "";


    portfolioEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Editar trabalho";


    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick =
        salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "inline-block";

}


// SALVAR EDIÇÃO

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const categoria =
        document.getElementById("categoria")
        .value;

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const data_trabalho =
        document.getElementById("data_trabalho")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do trabalho."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("portfolio")
            .update({

                nome: nome,
                cliente: cliente,
                categoria: categoria,
                descricao: descricao,
                valor: Number(valor) || 0,
                data_trabalho:
                    data_trabalho || null

            })
            .eq("id", portfolioEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho atualizado com sucesso!"
    );

    cancelarEdicao();

    carregarPortfolio();
}


// EXCLUIR

async function excluirPortfolio(id) {

    if (!confirm(
        "Tem certeza que deseja excluir este trabalho?"
    )) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("portfolio")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Trabalho excluído com sucesso!"
    );

    carregarPortfolio();
}


// CANCELAR

function cancelarEdicao() {

    portfolioEditando = null;

    limparFormulario();

    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Novo trabalho";

    document.getElementById(
        "botaoSalvar"
    ).textContent =
        "Adicionar trabalho";

    document.getElementById(
        "botaoSalvar"
    ).onclick =
        adicionarPortfolio;

    document.getElementById(
        "botaoCancelar"
    ).style.display =
        "none";
}


// LIMPAR

function limparFormulario() {

    document.getElementById("nome").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("categoria").value =
        "Design";

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    document.getElementById("data_trabalho").value = "";
}


// VOLTAR

function voltarDashboard() {

    window.location.href =
        "admin.html";
}


carregarPortfolio();

</script>

</body>
</html>
```
