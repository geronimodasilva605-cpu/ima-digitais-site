<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projetos - IMA Digitais</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topo h1 {
    margin: 0;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    background: #111;
    color: white;
}

.voltar {
    background: #555;
}

.editar {
    background: #2563eb;
}

.excluir {
    background: #dc2626;
}

.cancelar {
    background: #666;
}

.formulario,
.projetos {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

input,
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.projeto {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.projeto strong {
    display: block;
    font-size: 19px;
    margin-bottom: 7px;
}

.projeto span {
    display: block;
    margin: 4px 0;
}

.acoes {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div class="container">

<div class="topo">

    <h1>📁 Projetos IMA</h1>

    <button class="voltar" onclick="voltarDashboard()">
        ← Dashboard
    </button>

</div>


<div class="formulario">

<h2 id="tituloFormulario">Novo projeto</h2>

<input
    id="nome"
    type="text"
    placeholder="Nome do projeto"
>

<input
    id="cliente"
    type="text"
    placeholder="Nome do cliente"
>

<textarea
    id="descricao"
    placeholder="Descrição do projeto"
></textarea>

<input
    id="valor"
    type="number"
    placeholder="Valor em Kz"
>

<select id="status">

    <option value="Em andamento">
        Em andamento
    </option>

    <option value="Concluído">
        Concluído
    </option>

    <option value="Pendente">
        Pendente
    </option>

</select>

<button id="botaoSalvar" onclick="adicionarProjeto()">
    Adicionar projeto
</button>

<button
    id="botaoCancelar"
    class="cancelar"
    onclick="cancelarEdicao()"
    style="display:none;"
>
    Cancelar
</button>

</div>


<div class="projetos">

<h2>Projetos cadastrados</h2>

<div id="listaProjetos">
    Carregando projetos...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://vzqndrnwgpvbawjuezsd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ob3owo-lP6TCJbnTPW7Ecg_wyvaoEps";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let projetoEditando = null;


// ============================
// CARREGAR PROJETOS
// ============================

async function carregarProjetos() {

    const { data, error } =
        await supabaseClient
            .from("projetos")
            .select("*")
            .order("id", {
                ascending: false
            });

    const lista =
        document.getElementById(
            "listaProjetos"
        );


    if (error) {

        console.error(error);

        lista.innerHTML =
            "Erro ao carregar projetos: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "Nenhum projeto cadastrado ainda.";

        return;
    }


    lista.innerHTML = "";


    data.forEach(projeto => {

        const div =
            document.createElement("div");

        div.className = "projeto";


        div.innerHTML = `

            <strong>
                ${projeto.nome || ""}
            </strong>

            <span>
                Cliente: ${projeto.cliente || ""}
            </span>

            <span>
                Descrição: ${projeto.descricao || ""}
            </span>

            <span>
                Valor: ${Number(projeto.valor || 0).toLocaleString("pt-AO")} Kz
            </span>

            <span>
                Status: ${projeto.status || ""}
            </span>

            <div class="acoes">

                <button
                    class="editar"
                    onclick="editarProjeto(${projeto.id})"
                >
                    ✏️ Editar
                </button>

                <button
                    class="excluir"
                    onclick="excluirProjeto(${projeto.id})"
                >
                    🗑️ Excluir
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


// ============================
// ADICIONAR PROJETO
// ============================

async function adicionarProjeto() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do projeto."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("projetos")
            .insert([{

                nome: nome,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            }]);


    if (error) {

        console.error(error);

        alert(
            "Erro ao cadastrar projeto: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Projeto cadastrado com sucesso!"
    );


    limparFormulario();

    carregarProjetos();

}


// ============================
// EDITAR PROJETO
// ============================

async function editarProjeto(id) {

    const { data, error } =
        await supabaseClient
            .from("projetos")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Erro ao buscar projeto: " +
            error.message
        );

        return;
    }


    document.getElementById("nome").value =
        data.nome || "";

    document.getElementById("cliente").value =
        data.cliente || "";

    document.getElementById("descricao").value =
        data.descricao || "";

    document.getElementById("valor").value =
        data.valor || 0;

    document.getElementById("status").value =
        data.status || "Em andamento";


    projetoEditando = id;


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Editar projeto";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Salvar alterações";


    document.getElementById(
        "botaoSalvar"
    ).onclick = salvarEdicao;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "inline-block";

}


// ============================
// SALVAR EDIÇÃO
// ============================

async function salvarEdicao() {

    const nome =
        document.getElementById("nome")
        .value.trim();

    const cliente =
        document.getElementById("cliente")
        .value.trim();

    const descricao =
        document.getElementById("descricao")
        .value.trim();

    const valor =
        document.getElementById("valor")
        .value;

    const status =
        document.getElementById("status")
        .value;


    if (!nome) {

        alert(
            "Digite o nome do projeto."
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("projetos")
            .update({

                nome: nome,
                cliente: cliente,
                descricao: descricao,
                valor: Number(valor) || 0,
                status: status

            })
            .eq("id", projetoEditando);


    if (error) {

        console.error(error);

        alert(
            "Erro ao atualizar projeto: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Projeto atualizado com sucesso!"
    );


    cancelarEdicao();

    carregarProjetos();

}


// ============================
// EXCLUIR PROJETO
// ============================

async function excluirProjeto(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este projeto?"
        );


    if (!confirmar) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("projetos")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir projeto: " +
            error.message
        );

        return;
    }


    alert(
        "✅ Projeto excluído com sucesso!"
    );


    carregarProjetos();

}


// ============================
// CANCELAR EDIÇÃO
// ============================

function cancelarEdicao() {

    projetoEditando = null;

    limparFormulario();


    document.getElementById(
        "tituloFormulario"
    ).textContent = "Novo projeto";


    document.getElementById(
        "botaoSalvar"
    ).textContent = "Adicionar projeto";


    document.getElementById(
        "botaoSalvar"
    ).onclick = adicionarProjeto;


    document.getElementById(
        "botaoCancelar"
    ).style.display = "none";

}


// ============================
// LIMPAR FORMULÁRIO
// ============================

function limparFormulario() {

    document.getElementById("nome").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("descricao").value = "";

    document.getElementById("valor").value = "";

    document.getElementById("status").value =
        "Em andamento";

}


// ============================
// VOLTAR
// ============================

function voltarDashboard() {

    window.location.href =
        "admin.html";

}


carregarProjetos();

</script>

</body>
</html>
